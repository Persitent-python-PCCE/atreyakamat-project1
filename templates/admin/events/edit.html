{% extends "base.html" %}

{% block content %}
<div class="row my-4">
  <!-- Admin Sidebar -->
  <div class="col-md-3 mb-4">
    <div class="card shadow-sm border-0 p-3">
      <h5 class="fw-bold px-3 py-2 mb-2 border-bottom" style="color: var(--burgundy);">Admin Menu</h5>
      <div class="nav flex-column nav-pills">
        <a class="nav-link text-dark mb-1 fw-semibold" href="/admin/dashboard">📊 Dashboard</a>
        <a class="nav-link active btn-primary mb-1 fw-semibold" href="/admin/events" style="border-radius: 8px; color: var(--white) !important;">🎭 Events</a>
        <a class="nav-link text-dark mb-1 fw-semibold" href="/admin/categories">📂 Categories</a>
        <a class="nav-link text-dark mb-1 fw-semibold" href="/admin/venues">📍 Venues</a>
        <a class="nav-link text-dark mb-1 fw-semibold" href="/admin/bookings">🎟️ Bookings</a>
        <a class="nav-link text-dark mb-1 fw-semibold" href="/admin/analytics">📈 Analytics</a>
      </div>
    </div>
  </div>

  <!-- Edit Event Form -->
  <div class="col-md-9">
    <div class="card shadow-sm border-0 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
          <h3 class="fw-bold mb-0" style="color: var(--burgundy);">Edit Event #{{ event.id }}</h3>
          <p class="text-muted small mb-0">{{ event.title }}</p>
        </div>
        <div class="d-flex gap-2">
          <a href="/admin/events/{{ event.id }}/reschedule" class="btn btn-warning btn-sm text-dark fw-semibold">📅 Reschedule Event</a>
          <a href="/admin/events" class="btn btn-secondary btn-sm">&larr; Back to Events</a>
        </div>
      </div>

      {% if error %}
        <div class="alert alert-danger py-2 small mb-3" role="alert">
          {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="/admin/events/{{ event.id }}/edit">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <!-- Title -->
        <div class="mb-3">
          <label for="title" class="form-label fw-semibold">Event Title *</label>
          <input type="text" class="form-control" id="title" name="title" required value="{{ event.title }}">
        </div>

        <!-- Category & Venue Dropdowns -->
        <div class="row mb-3">
          <div class="col-md-6 mb-3 mb-md-0">
            <label for="category_id" class="form-label fw-semibold">Category *</label>
            <select class="form-select" id="category_id" name="category_id" required>
              {% for c in categories %}
                <option value="{{ c.id }}" {% if c.id == event.category_id %}selected{% endif %}>{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label for="venue_id" class="form-label fw-semibold">Venue *</label>
            <select class="form-select" id="venue_id" name="venue_id" required>
              {% for v in venues %}
                <option value="{{ v.id }}" {% if v.id == event.venue_id %}selected{% endif %}>{{ v.name }} ({{ v.city or 'General' }})</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Date & Times -->
        <div class="row mb-3">
          <div class="col-md-4 mb-3 mb-md-0">
            <label for="event_date" class="form-label fw-semibold">Event Date *</label>
            <input type="date" class="form-control" id="event_date" name="event_date" required value="{{ event.event_date }}">
          </div>
          <div class="col-md-4 mb-3 mb-md-0">
            <label for="start_time" class="form-label fw-semibold">Start Time *</label>
            <input type="time" class="form-control" id="start_time" name="start_time" required value="{{ event.start_time }}">
          </div>
          <div class="col-md-4">
            <label for="end_time" class="form-label fw-semibold">End Time (Optional)</label>
            <input type="time" class="form-control" id="end_time" name="end_time" value="{{ event.end_time or '' }}">
          </div>
        </div>

        <!-- Base Price, Status, Poster -->
        <div class="row mb-3">
          <div class="col-md-4 mb-3 mb-md-0">
            <label for="base_price" class="form-label fw-semibold">Base Ticket Price ($) *</label>
            <input type="number" step="0.01" min="0" class="form-control" id="base_price" name="base_price" value="{{ event.base_price }}" required>
          </div>
          <div class="col-md-4 mb-3 mb-md-0">
            <label for="status" class="form-label fw-semibold">Status *</label>
            <select class="form-select" id="status" name="status">
              <option value="published" {% if event.status == 'published' %}selected{% endif %}>Published</option>
              <option value="draft" {% if event.status == 'draft' %}selected{% endif %}>Draft</option>
              <option value="cancelled" {% if event.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="poster" class="form-label fw-semibold">Poster Image URL (Optional)</label>
            <input type="text" class="form-control" id="poster" name="poster" placeholder="https://example.com/poster.jpg" value="{{ event.poster or '' }}">
          </div>
        </div>

        <!-- Booleans: Booking Open & Requires Seats -->
        <div class="row mb-3">
          <div class="col-md-6 mb-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="booking_open" name="booking_open" value="1" {% if event.booking_open %}checked{% endif %}>
              <label class="form-check-label fw-semibold" for="booking_open">
                Booking Open (Customers can view and purchase tickets)
              </label>
            </div>
          </div>
          <div class="col-md-6 mb-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="requires_seats" name="requires_seats" value="1" {% if event.requires_seats %}checked{% endif %}>
              <label class="form-check-label fw-semibold" for="requires_seats">
                Requires Seat Selection (Assigned Seating)
              </label>
            </div>
          </div>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label for="description" class="form-label fw-semibold">Description</label>
          <textarea class="form-control" id="description" name="description" rows="3">{{ event.description or '' }}</textarea>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-2 border-top">
          <a href="/admin/events" class="btn btn-secondary px-4">Cancel</a>
          <button type="submit" class="btn btn-primary px-4">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
