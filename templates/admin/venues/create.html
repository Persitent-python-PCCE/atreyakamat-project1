{% extends "base.html" %}

{% block content %}
<div class="row my-4">
  <!-- Admin Sidebar -->
  {% include "admin/_sidebar.html" %}

  <!-- Create Venue Form -->
  <div class="col-md-9">
    <div class="card shadow-sm border-0 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h3 class="fw-bold mb-0" style="color: var(--burgundy);">Add New Venue</h3>
        <a href="/admin/venues" class="btn btn-secondary btn-sm">&larr; Back to Venues</a>
      </div>

      {% if error %}
        <div class="alert alert-danger py-2 small mb-3" role="alert">
          {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="/admin/venues/create">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <!-- Venue Name -->
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Venue Name *</label>
          <input type="text" class="form-control" id="name" name="name" required placeholder="e.g. SeatMeUp Arena" value="{{ request.form.get('name', '') if request.form else '' }}">
        </div>

        <!-- Address -->
        <div class="mb-3">
          <label for="address" class="form-label fw-semibold">Address *</label>
          <input type="text" class="form-control" id="address" name="address" required placeholder="e.g. 123 Demo Road" value="{{ request.form.get('address', '') if request.form else '' }}">
        </div>

        <!-- City & State -->
        <div class="row mb-3">
          <div class="col-md-6 mb-3 mb-md-0">
            <label for="city" class="form-label fw-semibold">City</label>
            <input type="text" class="form-control" id="city" name="city" placeholder="e.g. Panaji" value="{{ request.form.get('city', '') if request.form else '' }}">
          </div>
          <div class="col-md-6">
            <label for="state" class="form-label fw-semibold">State / Region</label>
            <input type="text" class="form-control" id="state" name="state" placeholder="e.g. Goa" value="{{ request.form.get('state', '') if request.form else '' }}">
          </div>
        </div>

        <!-- Capacity & Venue Type -->
        <div class="row mb-3">
          <div class="col-md-6 mb-3 mb-md-0">
            <label for="capacity" class="form-label fw-semibold">Capacity (Total seats / entries) *</label>
            <input type="number" min="0" class="form-control" id="capacity" name="capacity" required value="{{ request.form.get('capacity', '500') if request.form else '500' }}">
          </div>
          <div class="col-md-6">
            <label for="venue_type" class="form-label fw-semibold">Venue Type *</label>
            <select class="form-select" id="venue_type" name="venue_type">
              <option value="seated" {% if not request.form or request.form.get('venue_type') == 'seated' %}selected{% endif %}>Seated (Fixed seat numbers and rows)</option>
              <option value="general" {% if request.form and request.form.get('venue_type') == 'general' %}selected{% endif %}>General Admission (Open standing / unreserved)</option>
            </select>
          </div>
        </div>

        <!-- Initial Seating Grid Checkbox -->
        <div class="card bg-light border-0 p-3 mb-3" style="border-radius: 10px;">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="generate_default_seats" name="generate_default_seats" value="1" checked>
            <label class="form-check-label fw-semibold" for="generate_default_seats">
              <i class="bi bi-grid-3x3 me-1"></i> Automatically generate initial seating grid (Rows A–E, Seats 1–10 = 50 Seats)
            </label>
          </div>
          <small class="text-muted">
            You can customize, add, or delete individual seats anytime under <strong>Configure Seats</strong>.
          </small>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4 pt-2 border-top">
          <a href="/admin/venues" class="btn btn-secondary px-4">Cancel</a>
          <button type="submit" class="btn btn-primary px-4">Save Venue</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
