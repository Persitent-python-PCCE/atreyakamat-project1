{% extends "base.html" %}

{% block content %}
<div class="row my-4">
  <!-- Admin Sidebar -->
  <div class="col-md-3 mb-4">
    <div class="card shadow-sm border-0 bg-white p-3">
      <h5 class="fw-bold text-dark px-3 py-2 mb-2 border-bottom">Admin Menu</h5>
      <div class="nav flex-column nav-pills">
        <a class="nav-link text-dark mb-1 fw-semibold" href="/admin/dashboard">📊 Dashboard</a>
        <a class="nav-link active bg-danger text-white mb-1 fw-semibold" href="/admin/events">🎭 Events</a>
        <a class="nav-link text-dark mb-1 fw-semibold" href="/admin/categories">📂 Categories</a>
        <a class="nav-link text-dark mb-1 fw-semibold" href="/admin/venues">📍 Venues</a>
        <a class="nav-link text-dark mb-1 fw-semibold" href="/admin/bookings">🎟️ Bookings</a>
        <a class="nav-link text-dark mb-1 fw-semibold" href="/admin/analytics">📈 Analytics</a>
      </div>
    </div>
  </div>

  <!-- Create Event Form -->
  <div class="col-md-9">
    <div class="card shadow-sm border-0 bg-white p-4">
      <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h3 class="fw-bold text-dark mb-0">Create New Event</h3>
        <a href="/admin/events" class="btn btn-outline-secondary btn-sm">&larr; Back to Events</a>
      </div>

      {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">
          {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="/admin/events/create">
        <div class="mb-3">
          <label for="title" class="form-label fw-semibold">Event Title *</label>
          <input type="text" class="form-control" id="title" name="title" required placeholder="e.g. Symphony Under the Stars">
        </div>

        <div class="row mb-3">
          <div class="col-md-6 mb-3 mb-md-0">
            <label for="category_id" class="form-label fw-semibold">Category *</label>
            <select class="form-select" id="category_id" name="category_id" required>
              <option value="" disabled selected>Select a category</option>
              {% for c in categories %}
                <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label for="venue_id" class="form-label fw-semibold">Venue *</label>
            <select class="form-select" id="venue_id" name="venue_id" required>
              <option value="" disabled selected>Select a venue</option>
              {% for v in venues %}
                <option value="{{ v.id }}">{{ v.name }} ({{ v.city or 'General' }})</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-4 mb-3 mb-md-0">
            <label for="event_date" class="form-label fw-semibold">Event Date *</label>
            <input type="date" class="form-control" id="event_date" name="event_date" required>
          </div>
          <div class="col-md-4 mb-3 mb-md-0">
            <label for="start_time" class="form-label fw-semibold">Start Time *</label>
            <input type="time" class="form-control" id="start_time" name="start_time" required>
          </div>
          <div class="col-md-4">
            <label for="end_time" class="form-label fw-semibold">End Time (Optional)</label>
            <input type="time" class="form-control" id="end_time" name="end_time">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6 mb-3 mb-md-0">
            <label for="base_price" class="form-label fw-semibold">Base Ticket Price ($) *</label>
            <input type="number" step="0.01" min="0" class="form-control" id="base_price" name="base_price" value="0.00" required>
          </div>
          <div class="col-md-6">
            <label for="description" class="form-label fw-semibold">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" placeholder="Detailed event description..."></textarea>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <a href="/admin/events" class="btn btn-outline-secondary px-4">Cancel</a>
          <button type="submit" class="btn btn-danger px-4 fw-bold">Create Event</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
