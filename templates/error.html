{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-6">
    <div class="card shadow-sm border-0 text-center p-5 bg-white">
      <div class="display-1 text-danger mb-3">⚠️</div>
      <h2 class="fw-bold mb-2">Notice</h2>
      <p class="text-muted fs-5 mb-4">{{ message or 'An unexpected error occurred. Please try again.' }}</p>
      {% if status_code %}
        <p class="badge bg-secondary mb-4 align-self-center">Error Code: {{ status_code }}</p>
      {% endif %}
      <div class="d-flex justify-content-center gap-3">
        <a href="/" class="btn btn-danger px-4">Back to Home</a>
        <a href="/events" class="btn btn-outline-dark px-4">Explore Events</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
