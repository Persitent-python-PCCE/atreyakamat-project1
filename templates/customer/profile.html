{% extends "base.html" %}

{% block content %}
<div class="my-4">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow-sm border-0 bg-white p-4">
        <h2 class="fw-bold text-dark mb-4">User Profile</h2>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label fw-semibold text-muted">Full Name</label>
          <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext fw-bold text-dark" value="{{ user.name }}">
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label fw-semibold text-muted">Email Address</label>
          <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext text-dark" value="{{ user.email }}">
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label fw-semibold text-muted">Role</label>
          <div class="col-sm-8">
            <span class="badge bg-primary text-capitalize">{{ user.role }}</span>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label fw-semibold text-muted">Phone Number</label>
          <div class="col-sm-8">
            <input type="text" readonly class="form-control-plaintext text-dark" value="{{ user.phone or 'Not provided' }}">
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label fw-semibold text-muted">Reward Balance</label>
          <div class="col-sm-8">
            <span class="fs-5 fw-bold text-success">₹{{ "%.2f"|format(user.reward_balance or 0.0) }}</span>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label fw-semibold text-muted">Account Status</label>
          <div class="col-sm-8">
            <span class="badge {% if user.is_active %}bg-success{% else %}bg-secondary{% endif %}">
              {{ 'Active' if user.is_active else 'Inactive' }}
            </span>
          </div>
        </div>

        <div class="mb-3 row">
          <label class="col-sm-4 col-form-label fw-semibold text-muted">Member Since</label>
          <div class="col-sm-8">
            <span class="text-muted small">{{ user.created_at[:10] if user.created_at else '—' }}</span>
          </div>
        </div>

        <hr class="my-4">

        <div class="d-flex justify-content-between">
          <a href="/dashboard" class="btn btn-outline-secondary">&larr; Back to Dashboard</a>
          <a href="/logout" class="btn btn-outline-danger">Log Out</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
