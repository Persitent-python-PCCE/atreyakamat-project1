{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 bg-white p-4">
      <div class="card-body">
        <h3 class="card-title fw-bold text-center mb-1 text-dark">Welcome Back</h3>
        <p class="text-center text-muted small mb-4">Log in to manage your tickets and bookings</p>

        {% if error %}
          <div class="alert alert-danger py-2 small" role="alert">
            {{ error }}
          </div>
        {% endif %}

        <form method="POST" action="/login">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="alice@example.com">
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Sign In</button>
        </form>

        <div class="text-center mt-4">
          <span class="text-muted small">Don't have an account?</span>
          <a href="/register" class="small fw-semibold text-danger text-decoration-none">Register here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
