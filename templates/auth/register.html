{% extends "base.html" %}

{% block content %}
<section class="auth-box">
  <div class="text-center mb-3">
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SeatMeUp" style="height: 56px; width: auto; object-fit: contain;">
  </div>
  <h2 class="text-center mb-1">Create Account</h2>
  <p class="text-muted small text-center mb-3">Join SeatMeUp to book events and reserve seats in seconds.</p>

  {% if error %}
    <div class="alert alert-danger py-2 small mb-3" role="alert">
      {{ error }}
    </div>
  {% endif %}

  {% if result and not result.success %}
    <div class="alert alert-danger py-2 small mb-3" role="alert">
      {{ result.message }}
    </div>
  {% endif %}

  <form method="POST" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <div>
      <label for="name">Full Name *</label>
      <input type="text" id="name" name="name" class="form-control"  required value="{{ request.form.get('name', '') if request.form else '' }}">
    </div>

    <div>
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" class="form-control"  required value="{{ request.form.get('email', '') if request.form else '' }}">
    </div>

    <div>
      <label for="phone">Phone Number (Optional)</label>
      <input type="tel" id="phone" name="phone" class="form-control"  value="{{ request.form.get('phone', '') if request.form else '' }}">
    </div>

    <div>
      <label for="password">Password *</label>
      <input type="password" id="password" name="password" class="form-control"  required>
    </div>

    <div>
      <label for="confirm_password">Confirm Password *</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary mt-2">Create Account</button>
  </form>

  <div class="text-center mt-3 pt-2 border-top">
    <span class="text-muted small">Already have an account?</span>
    <a href="/login" class="small fw-bold" style="color: var(--primary); text-decoration: none;">Log in here</a>
  </div>
</section>
{% endblock %}
