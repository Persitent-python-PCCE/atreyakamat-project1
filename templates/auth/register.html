{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-6">
    <div class="card shadow-sm border-0 bg-white p-4">
      <div class="card-body">
        <h3 class="card-title fw-bold text-center mb-1 text-dark">Create Account</h3>
        <p class="text-center text-muted small mb-4">Join SeatMeUp for instant seat reservations</p>

        {% if error %}
          <div class="alert alert-danger py-2 small" role="alert">
            {{ error }}
          </div>
        {% endif %}

        <form method="POST" action="/register">
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control" id="name" name="name" required placeholder="John Doe">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="john@example.com">
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label fw-semibold">Phone Number (Optional)</label>
            <input type="tel" class="form-control" id="phone" name="phone" placeholder="+1234567890">
          </div>
          <div class="row mb-4">
            <div class="col-md-6 mb-3 mb-md-0">
              <label for="password" class="form-label fw-semibold">Password</label>
              <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>
            <div class="col-md-6">
              <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="••••••••">
            </div>
          </div>
          <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Register Account</button>
        </form>

        <div class="text-center mt-4">
          <span class="text-muted small">Already have an account?</span>
          <a href="/login" class="small fw-semibold text-danger text-decoration-none">Log in here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
