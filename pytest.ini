[pytest]
testpaths = tests/unit tests/models tests/controllers tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unit: Pure unit tests for services, serializers, and logic with mocked DAOs
    model: SQLAlchemy model structure and relationship tests
    controller: Controller and API endpoint tests using Flask test client
    integration: Multi-step API and workflow integration tests
    mysql: Live MySQL schema compatibility smoke tests (requires SEATMEUP_RUN_MYSQL_TESTS=1)
    slow: Slower running tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
    ignore::sqlalchemy.exc.LegacyAPIWarning
    ignore::jwt.warnings.InsecureKeyLengthWarning
